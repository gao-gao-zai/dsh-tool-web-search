# Keep the shipped `tool-web` row intact; this package uses a distinct model tool name.
- insert:
    - id: web-search
      name: '@linxin666/dsh-tool-web-search'
    - id: web-search-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: web-search
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

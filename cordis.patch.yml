# The user must disable the shipped `tool-web` plugin before starting this replacement.
# The rows below then provide the replacement web_search/web_fetch tools and the bundled Skill.
- insert:
    - id: web-search
      name: '@linxin666/dsh-tool-web-search'
    - id: web-search-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: web-search
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
